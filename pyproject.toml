[build-system]
requires = ["setuptools>=77,<82", "wheel>=0.43,<1"]
build-backend = "setuptools.build_meta"

[project]
name = "taylorgauss-3x3"
version = "0.1.0"
description = "Exact periodic 3x3 one-slice Hubbard sampling"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["numpy==2.4.4", "torch==2.11.0"]

[project.optional-dependencies]
dev = [
    "build>=1.2,<2",
    "pytest>=8,<10",
    "setuptools>=77,<82",
    "wheel>=0.43,<1",
]

[project.scripts]
tg-3x3 = "taylorgauss_3x3.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["taylorgauss_3x3*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
